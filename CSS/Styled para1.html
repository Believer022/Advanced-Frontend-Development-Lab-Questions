<!DOCTYPE html>
<html>
<head>
  <title>Three Styled Paragraphs</title>
  <style>
    .para1 {
       color: aqua;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Arial', sans-serif;
      background-color: #ffe6e6;
      padding: 15px;
      margin: 20px;
      text-align: center;
      border: 2px solid red;
      border-radius: 10px;
    }

    .para2 {
      color: green;
      background-color: #e0f7e0;
      padding: 10px;
    }

    .para3 {
      color: blue;
      font-style: italic;
      border: 2px solid blue;
      padding: 8px;
    }
  </style>
</head>
<body>

  <p class="para1">This is the first paragraph with red bold text.</p>

  <p class="para2">This is the second paragraph with green text and a light green background.</p>

  <p class="para3">This is the third paragraph with italic blue text and a border.</p>

</body>
</html>
