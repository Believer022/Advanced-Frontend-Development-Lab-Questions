<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d1ec4e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      border: 2px solid rgb(51, 110, 220);
      width: 350px;
      background-color: rgb(142, 113, 239);
    }

    .login-header {
      background-color: rgb(40, 75, 233);
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .login-body {
      padding: 30px;
    }

    .login-body label {
      display: inline-block;
      width: 80px;
      color: rgb(222, 168, 67);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .login-body input[type="text"],
    .login-body input[type="password"] {
      width: 200px;
      padding: 5px;
      border: 2px solid orange;
      margin-bottom: 20px;
    }

    .login-body .login-btn {
      background-color: orange;
      color: white;
      border: none;
      padding: 12px 30px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }

    .login-body .login-btn:hover {
      background-color: darkorange;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
      Login Form
    </div>
    <div class="login-body">
      <form>
        <label for="userid">userid</label>
        <input type="text" id="userid" name="userid"><br>

        <label for="password">password</label>
        <input type="password" id="password" name="password"><br>

        <input type="submit" class="login-btn" value="Login">
      </form>
    </div>
  </div>

</body>
</html>
